<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOL Terminal</title>
<style>
  :root {
    --bg: #07070a; --panel: #0e0d12; --line: #2a2418;
    --gold: #d4a241; --gold-hi: #f5d88c; --ink: #e9e3d4; --mute: #8a826f;
    --up: #6fd38a; --down: #e0604a;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--mono); }
  header {
    display: flex; align-items: center; gap: 18px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: linear-gradient(#100e09, var(--bg));
  }
  header b { color: var(--gold); letter-spacing: .18em; font-size: 14px; }
  .tag { padding: 2px 8px; border: 1px solid var(--gold); color: var(--gold); border-radius: 3px; font-size: 11px; letter-spacing: .1em; }
  .tag.live { border-color: var(--down); color: var(--down); }
  .tag.off { border-color: var(--mute); color: var(--mute); }
  #pnl { margin-left: auto; font-size: 18px; font-weight: 700; }
  button {
    font: inherit; cursor: pointer; background: transparent; color: var(--gold);
    border: 1px solid var(--gold); border-radius: 3px; padding: 3px 10px;
  }
  button:hover { background: var(--gold); color: var(--bg); }
  #panic { border-color: var(--down); color: var(--down); }
  #panic:hover { background: var(--down); color: var(--bg); }
  main { display: grid; grid-template-columns: 1fr 1.6fr 1.2fr; gap: 1px; background: var(--line); height: calc(100% - 52px); }
  section { background: var(--panel); padding: 12px 14px; overflow: auto; min-height: 0; }
  h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .2em; color: var(--mute); font-weight: 500; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 3px 0; border-bottom: 1px solid #16130d; display: flex; justify-content: space-between; gap: 8px; }
  li i { color: var(--mute); font-style: normal; }
  li.bad { color: var(--mute); text-decoration: line-through; }
  li.new { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: rgba(212, 162, 65, .25); } to { background: transparent; } }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--mute); font-weight: 500; font-size: 11px; letter-spacing: .08em; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 5px 6px; border-bottom: 1px solid #16130d; white-space: nowrap; }
  td.sym { color: var(--gold-hi); max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .up { color: var(--up); } .down { color: var(--down); }
  pre { margin: 14px 0 0; padding-top: 10px; border-top: 1px solid var(--line); color: var(--mute); white-space: pre-wrap; font: 12px/1.5 var(--mono); }
  .empty { color: var(--mute); padding: 8px 0; }
  body.clean header button, body.clean td:last-child, body.clean th:last-child { display: none; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } }
</style>
</head>
<body>
<header>
  <b>SOL TERMINAL</b>
  <span id="mode" class="tag off">OFFLINE</span>
  <span id="pnl">0.000 SOL</span>
  <button id="hide" title="H">HIDE</button>
  <button id="panic">PANIC SELL</button>
</header>
<main>
  <section><h2>LAUNCHES</h2><ul id="feed"><li class="empty">waiting for the server…</li></ul></section>
  <section><h2>WATCHLIST</h2>
    <table><thead><tr><th>TOKEN</th><th>SCORE</th><th>LIQ</th><th>B/S 5M</th><th>STAGE</th><th></th></tr></thead><tbody id="watch"></tbody></table>
  </section>
  <section><h2>POSITIONS</h2>
    <table><thead><tr><th>TOKEN</th><th>PNL</th></tr></thead><tbody id="pos"></tbody></table>
    <pre id="log"></pre>
  </section>
</main>
<script>
  // Token names and symbols come from strangers on pump.fun.
  // Never put them into innerHTML: build nodes and set textContent.
  const $ = (id) => document.getElementById(id);
  const PORT = new URLSearchParams(location.search).get("port") || "8787";
  const MINT = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;      // base58 address shape
  const usd = (n) => (n == null ? "-" : "$" + Math.round(n).toLocaleString());
  let ws, seen = new Set();

  function el(tag, text, cls) {
    const e = document.createElement(tag);
    if (text != null) e.textContent = String(text);
    if (cls) e.className = cls;
    return e;
  }

  function render(s) {
    $("mode").textContent = s.paper ? "PAPER" : "LIVE";
    $("mode").className = "tag" + (s.paper ? "" : " live");
    $("pnl").textContent = (s.pnl >= 0 ? "+" : "") + s.pnl.toFixed(3) + " SOL";
    $("pnl").className = s.pnl >= 0 ? "up" : "down";

    const feed = $("feed"); feed.replaceChildren();
    for (const t of s.feed) {
      const li = el("li", null, t.safety && t.safety.ok === false ? "bad" : seen.has(t.mint) ? "" : "new");
      li.append(el("span", t.symbol), el("i", t.stage));
      feed.append(li); seen.add(t.mint);
    }

    const watch = $("watch"); watch.replaceChildren();
    for (const t of s.watch) {
      const tr = el("tr");
      const ratio = (t.buysM5 || 0) / Math.max(1, t.sellsM5 || 0);
      tr.append(
        el("td", t.symbol, "sym"), el("td", t.score), el("td", usd(t.liquidityUsd)),
        el("td", `${t.buysM5 || 0}/${t.sellsM5 || 0}`, ratio >= 1.3 ? "up" : ""), el("td", t.stage)
      );
      const td = el("td");
      if (MINT.test(t.mint)) {
        const b = el("button", "BUY");
        b.onclick = () => ws.send(JSON.stringify({ type: "buy", mint: t.mint }));
        td.append(b);
      }
      tr.append(td); watch.append(tr);
    }
    if (!s.watch.length) {
      const tr = el("tr"), td = el("td", "nothing passes the filters yet", "empty");
      td.colSpan = 6; tr.append(td); watch.append(tr);
    }

    const pos = $("pos"); pos.replaceChildren();
    for (const p of s.positions) {
      const tr = el("tr");
      tr.append(el("td", p.symbol, "sym"), el("td", (p.pnl >= 0 ? "+" : "") + (p.pnl * 100).toFixed(1) + "%", p.pnl >= 0 ? "up" : "down"));
      pos.append(tr);
    }
    $("log").textContent = s.log.slice().reverse().join("\n");
  }

  function connect() {
    ws = new WebSocket(`ws://127.0.0.1:${PORT}`);
    ws.onmessage = (e) => render(JSON.parse(e.data));
    ws.onclose = () => { $("mode").textContent = "OFFLINE"; $("mode").className = "tag off"; setTimeout(connect, 1500); };
  }
  connect();

  $("panic").onclick = () => confirm("Close every position?") && ws.send(JSON.stringify({ type: "panic" }));
  const toggle = () => document.body.classList.toggle("clean");
  $("hide").onclick = toggle;
  addEventListener("keydown", (e) => { if (e.key === "h" || e.key === "H") toggle(); });
</script>
</body>
</html>
